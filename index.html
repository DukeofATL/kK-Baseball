<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13274F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kK">
<title>kK Baseball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0b1630; --panel:#0f1f42; --panel2:#13274F; --line:#3a4d72; --accent:#CE1141; --hi:#EAAA00; --primary:#13274F; --text:#f5f3ee; --muted:#a9b3c7; --ok:#3fbf7f; --no:#e5566f; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--text); }
body { font:16px/1.45 "DM Sans", system-ui, sans-serif; min-height:100vh; }
button { font:inherit; color:inherit; cursor:pointer; }
h1, h2, h3, .big, .wm, .cnt { font-family:"Bricolage Grotesque", "DM Sans", sans-serif; }
h2 { font-size:22px; margin:2px 0 10px; } h3 { font-size:16px; margin:14px 0 8px; color:var(--hi); }
p { margin:8px 0; }
.k { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.foot { color:var(--muted); font-size:13px; }
.center { text-align:center; }
#app { max-width:560px; margin:0 auto; padding-bottom:84px; }
header { position:relative; z-index:5; background:linear-gradient(180deg, var(--primary), var(--bg)); padding:10px 14px 10px; border-bottom:3px solid var(--accent); }
.hrow { display:flex; align-items:center; gap:10px; }
.brand, .gear { background:none; border:0; padding:0; color:var(--text); }
.gear { font-size:22px; width:44px; height:44px; }
.logo { display:block; color:var(--text); }
.score { flex:1; display:flex; justify-content:center; gap:22px; font-size:24px; font-family:"Bricolage Grotesque", sans-serif; }
.score b { font-weight:800; }
.hsub { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:13px; color:var(--muted); margin-top:4px; }
.hsub .mode { margin-left:auto; }
.minipace { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13px; cursor:pointer; }
.mpbar { position:relative; flex:0 0 38%; height:8px; border-radius:99px; background:rgba(255,255,255,.12); }
.mpbar i { position:absolute; top:-4px; width:2px; height:16px; background:var(--hi); }
.mpbar b { position:absolute; top:0; height:8px; border-radius:99px; }
.mpbar b.up, .fill.up, .strip i.up { background:var(--accent); }
.mpbar b.dn, .fill.dn, .strip i.dn { background:#6f86b8; }
.sync, .vc { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
.sync span { flex:1; min-width:150px; }
.pitchbtn { background:var(--hi); color:#111; border:0; border-radius:12px; padding:12px 18px; font-weight:800; }
.pitchbtn.sm { padding:8px 12px; }
.vc button, .row button, .ghost { border:1px solid var(--line); background:transparent; border-radius:10px; padding:9px 12px; min-height:40px; }
.vc button.on { background:var(--line); }
.waiting { color:var(--hi); font-weight:700; padding:0 6px; }
.link { background:none; border:0; color:var(--hi); text-decoration:underline; }
.warn { margin-top:8px; background:#5a1a26; border-radius:8px; padding:8px 10px; font-size:13px; }
main { padding:12px 12px 0; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; margin:0 0 12px; }
.card.quiet p { color:var(--muted); }
.act { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:13px 16px; font-weight:700; min-height:46px; }
.act.wide { width:100%; margin-top:6px; }
.pills { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
.pills button { flex:1 1 30%; min-height:52px; border:1px solid var(--line); background:var(--panel2); border-radius:12px; padding:10px 8px; font-weight:600; font-size:15px; }
.pills button.on, .seg button.on, .keypick.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.callcard { border:2px solid var(--accent); scroll-margin-bottom:84px; scroll-margin-top:8px; }
.callhead { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.who { font-size:18px; font-weight:700; margin-top:2px; }
.cnt { font-size:34px; font-weight:800; color:var(--hi); line-height:1; }
.step { margin-top:12px; font-size:13px; font-weight:700; color:var(--hi); }
.locked { background:rgba(234,170,0,.14); border-radius:10px; padding:8px 10px; font-size:14px; }
.ctx .row3 { display:grid; grid-template-columns:86px 1fr; gap:8px; padding:7px 0; border-top:1px solid rgba(255,255,255,.07); }
.ctx .row3:first-child { border-top:0; }
.seq { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.pc { font-size:12.5px; background:var(--panel2); border-radius:7px; padding:3px 7px; }
.pc i { color:var(--muted); font-style:normal; }
.mx { display:inline-block; margin-right:10px; font-size:14px; }
.mx b { color:var(--hi); }
.read p { font-size:16px; }
.abgrade .gl { font-size:14px; margin:4px 0; }
.ok { color:var(--ok); font-weight:800; } .no { color:var(--no); font-weight:800; }
.chip { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); width:min(520px, calc(100% - 24px)); background:var(--panel2); border:2px solid var(--hi); border-radius:16px; padding:12px; z-index:9; box-shadow:0 10px 30px rgba(0,0,0,.45); }
.cbar { height:4px; background:rgba(255,255,255,.12); border-radius:4px; margin-top:8px; overflow:hidden; } .cbar i { display:block; height:4px; background:var(--hi); }
.tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile { background:var(--panel2); border-radius:12px; padding:10px; }
.tile .big { font-size:17px; font-weight:800; margin:2px 0; }
.meter { position:relative; height:34px; border-radius:10px; background:rgba(255,255,255,.08); margin:14px 0 4px; overflow:hidden; }
.meter .band { position:absolute; top:0; height:34px; background:rgba(234,170,0,.22); }
.meter .fill { position:absolute; top:11px; height:12px; border-radius:6px; }
.meter .tick { position:absolute; top:0; width:3px; height:34px; background:var(--hi); margin-left:-1px; }
.meter .dot { position:absolute; top:7px; width:20px; height:20px; border-radius:50%; background:#fff; margin-left:-10px; border:3px solid var(--accent); }
.scale { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
.pline { font-size:18px; font-weight:700; }
.engines { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0; }
.engines div { background:var(--panel2); border-radius:12px; padding:10px; }
.engines b { display:block; font-size:22px; font-family:"Bricolage Grotesque", sans-serif; }
.swing { padding:6px 0; border-top:1px solid rgba(255,255,255,.07); font-size:14px; }
.keypick { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel2); border-radius:12px; padding:12px; margin:8px 0; min-height:50px; }
.key { border-left:4px solid var(--line); padding:8px 10px; margin:8px 0; background:var(--panel2); border-radius:8px; }
.key.won { border-color:var(--ok); } .key.lost { border-color:var(--no); } .key.close { border-color:var(--hi); }
.boxline { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:10px 0; text-align:center; }
.boxline div { background:var(--panel2); border-radius:10px; padding:8px 4px; }
.boxline b { display:block; font-size:26px; font-family:"Bricolage Grotesque", sans-serif; }
.boxline span { font-size:11px; color:var(--muted); }
.seg { display:flex; gap:6px; margin:6px 0 10px; flex-wrap:wrap; }
.seg button { flex:1; border:1px solid var(--line); background:transparent; border-radius:10px; padding:9px 6px; font-size:13px; min-height:42px; }
table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:7px 4px; border-bottom:1px solid rgba(255,255,255,.08); }
.gp { padding:7px 0; border-top:1px solid rgba(255,255,255,.07); }
nav { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; gap:6px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(8,14,30,.96); border-top:1px solid var(--line); z-index:6; }
nav button { flex:1; max-width:130px; border:0; background:transparent; border-radius:12px; padding:11px 6px; font-weight:700; color:var(--muted); }
nav button.on { background:var(--accent); color:#fff; }
.toast { position:fixed; bottom:96px; left:50%; transform:translateX(-50%); width:min(520px, calc(100% - 24px)); background:#fff; color:#111; border-radius:12px; padding:12px 14px; z-index:20; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.4); }
.sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:15; display:flex; align-items:flex-end; justify-content:center; }
.sheetin { background:var(--panel); width:min(560px,100%); max-height:88vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
.sheetin label { display:block; margin:14px 0 4px; font-size:13px; font-weight:700; color:var(--hi); }
.colors { display:flex; gap:10px; align-items:center; } .colors input { width:48px; height:42px; border:0; background:none; padding:0; }
.txt { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px; font:inherit; }
.row { display:flex; gap:8px; margin-top:12px; } .row .txt { flex:1; }
.start { padding:18px 12px; }
.hero { text-align:center; padding:20px 8px 10px; }
.hero .logo { margin:0 auto; }
.hero h1 { font-size:46px; margin:4px 0; }
.wm .mk { display:inline-block; transform:scaleX(-1); }
.gamebtn { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel2); border-radius:12px; padding:12px; margin:8px 0; }
.gamebtn span { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
.how p { font-size:14px; color:var(--muted); }

/* v2 */
:focus-visible { outline:3px solid var(--hi); outline-offset:2px; }
.vc { flex-wrap:nowrap; }
.vc .lead { flex:0 0 96px; display:flex; }
.vc .lead > * { width:100%; }
.vc .speeds { display:flex; gap:4px; }
.vc .speeds button { min-width:44px; padding:9px 6px; }
.act.sm { padding:9px 10px; min-height:40px; font-size:14px; }
.waiting { display:flex; align-items:center; justify-content:center; background:var(--hi); color:#111; border-radius:10px; font-weight:800; min-height:40px; padding:0 8px; }
.minipace { width:100%; background:none; border:0; text-align:left; padding:0; color:var(--text); }
.bookline { background:rgba(0,0,0,.22); border:1px solid var(--line); border-radius:12px; padding:7px 10px; margin:10px 0 4px; }
.bookline .bk { color:var(--hi); }
.mixrow .ml { color:var(--muted); font-size:12px; width:38px; display:inline-block; }
.mixrow .mx { font-size:13.5px; margin-right:0; }
.mixrow { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; margin-top:3px; }
.coach { background:rgba(234,170,0,.14); border:1px solid var(--hi); border-radius:12px; padding:10px; margin:10px 0 4px; font-size:14px; }
.callcard.pulse { animation:pulse 1.4s ease-out 1; }
@keyframes pulse { 0% { box-shadow:0 0 0 0 var(--accent); } 100% { box-shadow:0 0 0 18px rgba(0,0,0,0); } }
@media (prefers-reduced-motion: reduce) { .callcard.pulse { animation:none; } }
.locked { background:rgba(234,170,0,.16); border:2px solid var(--hi); border-radius:10px; padding:9px 11px; font-size:14px; color:var(--text); }
.flash { border-left:5px solid var(--no); }
.flash.good { border-left-color:var(--ok); }
.flash p { margin:4px 0 0; }
main.chipped { padding-bottom:200px; }
.chipq { margin:2px 0 4px; font-size:14px; color:var(--muted); }
.glove { border-top:1px solid var(--line); margin-top:8px; padding-top:8px; }
.advgrid { display:grid; grid-template-columns:52px 1fr 52px; grid-template-rows:44px auto 44px; gap:4px; max-width:340px; margin:8px auto 4px; }
.advgrid .top { grid-column:1 / 4; grid-row:1; }
.advgrid .bot { grid-column:1 / 4; grid-row:3; }
.advgrid .side.l { grid-column:1; grid-row:2; }
.advgrid .side.r { grid-column:3; grid-row:2; }
.advgrid .inner { grid-column:2; grid-row:2; display:grid; grid-template-columns:repeat(3,1fr); gap:3px; }
.advgrid button { border:1px solid var(--line); background:var(--panel2); border-radius:8px; font-size:12px; line-height:1.15; padding:4px 2px; min-height:44px; }
.advgrid .ch { border-style:dashed; background:rgba(255,255,255,.04); color:var(--muted); }
.advgrid .side { writing-mode:vertical-rl; transform:rotate(180deg); }
.advgrid button.on { background:var(--accent); border-color:var(--accent); color:#fff; border-style:solid; }
.strip { position:relative; display:flex; gap:3px; height:60px; margin:8px 0 4px; }
.strip .axis { position:absolute; left:0; right:0; top:30px; height:1px; background:var(--muted); opacity:.6; }
.strip i { flex:1; align-self:flex-start; border-radius:3px; }
.strip i.up { height:var(--h); margin-top:calc(30px - var(--h)); background:var(--accent); }
.strip i.dn { height:var(--h); margin-top:31px; background:#8ea6d8; }
.strip i.empty { height:2px; margin-top:29px; background:rgba(255,255,255,.12); }
.engines .foot { display:block; margin-top:4px; font-size:12px; }
.headline { font-size:17px; font-weight:700; }
.cmd { display:grid; grid-template-columns:90px 1fr 56px; gap:8px; align-items:center; margin-top:6px; }
.cbar2 { height:10px; border-radius:6px; background:rgba(229,86,111,.55); overflow:hidden; }
.cbar2 i { display:block; height:10px; background:var(--ok); }
.filebtn { position:relative; display:inline-flex; align-items:center; justify-content:center; margin:0; font-size:15px; color:var(--text); font-weight:400; }
.filebtn input { position:absolute; inset:0; opacity:0; cursor:pointer; }
details.more summary { cursor:pointer; font-weight:700; color:var(--hi); }
.hero p { color:var(--muted); max-width:360px; margin:8px auto 0; }
@media (max-width:380px) { .hsub .mode { display:none; } header { padding:8px 12px; } .callcard .who { font-size:16px; } .cnt { font-size:28px; } .bookline .mx { font-size:12.5px; } .step { margin-top:8px; } .score { font-size:21px; gap:14px; } .pills button { font-size:14px; min-height:48px; } .advgrid { grid-template-columns:44px 1fr 44px; } .cmd { grid-template-columns:74px 1fr 50px; } }
.sofar { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:10px 0 0; }
.sofar .ml, .mixrow .ml { color:var(--muted); font-size:12px; width:44px; display:inline-block; }
.sofar .pc { font-size:12px; padding:2px 6px; }
.sync .waiting { flex:0 0 auto; }
.callhead { position:sticky; top:0; z-index:2; background:var(--panel); margin:-14px -14px 0; padding:12px 14px 6px; border-radius:16px 16px 0 0; }
@media (max-height:700px) { .sofar .pc:nth-last-child(n+4) { display:none; } .coach { font-size:13px; padding:8px; } .pills button { min-height:46px; } }
/* v4 design pass */
.k { font-size:12.5px; letter-spacing:.01em; text-transform:none; color:var(--muted); font-weight:600; }
h3 { font-family:"DM Sans", sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.01em; color:var(--muted); margin:2px 0 8px; }
header { background:linear-gradient(180deg, var(--panel2), var(--bg)); }
.score { align-items:center; gap:14px; }
.score .sc { display:flex; align-items:baseline; gap:7px; }
.score .ab { font:700 14px/1 "DM Sans", sans-serif; letter-spacing:.06em; color:var(--muted); }
.score b { font:800 30px/1 "Bricolage Grotesque", sans-serif; font-variant-numeric:tabular-nums; }
.score .sep { width:1px; height:24px; background:var(--line); }
.minipace span:last-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vc .act { background:var(--accent); border-color:var(--accent); color:#fff; }
nav button.on { background:transparent; color:var(--text); box-shadow:inset 0 3px 0 var(--accent); border-radius:0 0 12px 12px; }
.sheetin .pills button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
.keypick.on { background:var(--panel2); border:2px solid var(--accent); color:var(--text); }
.seg button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
.pills button { padding:10px 4px; }
.pills.two button { flex:1 1 40%; }
.bookline { padding:8px 10px 10px; }
.mixrow { display:grid; grid-template-columns:44px repeat(3,1fr); gap:6px; align-items:end; margin-top:8px; }
.mixrow .ml { width:auto; align-self:center; }
.mixrow .mx { font-size:12px; color:var(--muted); line-height:1.2; }
.mixrow .mx b { display:block; font:800 18px/1 "Bricolage Grotesque", sans-serif; color:var(--hi); margin-bottom:2px; }
.callcard.is-locked { border-color:var(--hi); }
.lockedlab { color:var(--hi); font-weight:700; }
.locked { background:var(--panel2); border:0; box-shadow:inset 0 0 0 2px var(--hi); font-weight:500; }
.locked b { color:var(--hi); }
.coach { display:flex; gap:10px; align-items:flex-start; }
.coach p { margin:0; flex:1; }
.ghost.sm { min-height:40px; padding:9px 12px; flex:0 0 auto; }
.flash { border:2px solid var(--no); }
.flash.good { border-color:var(--ok); }
.verdict { font:800 28px/1.05 "Bricolage Grotesque", sans-serif; }
.flash .actual { font-size:15px; margin:6px 0 8px; }
.vs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.vs > div { background:var(--panel2); border-radius:10px; padding:8px 10px; font-size:14px; }
.vs .k { display:block; margin-bottom:2px; }
.advgrid { grid-template-rows:44px auto 44px 22px; }
.advgrid .inner { outline:2px solid rgba(255,255,255,.7); outline-offset:3px; border-radius:6px; }
.advgrid .plate { grid-column:2; grid-row:4; width:44px; height:18px; justify-self:center; align-self:end; }
.advgrid .plate path { fill:none; stroke:var(--muted); stroke-width:2; stroke-linejoin:round; }
.paceHero { display:flex; align-items:baseline; gap:12px; margin-top:4px; }
.paceHero b { font:800 56px/1 "Bricolage Grotesque", sans-serif; font-variant-numeric:tabular-nums; }
.paceHero span { font-size:15px; }
.pline { font-size:16px; font-weight:400; }
.meter { overflow:visible; }
.strip { height:76px; gap:3px; }
.strip .axis { top:38px; }
.strip i:nth-of-type(2n+1):not(:first-of-type) { margin-left:5px; }
.strip i.up { margin-top:calc(38px - var(--h)); }
.strip i.dn { margin-top:39px; }
.strip i.empty { margin-top:37px; }
.innings { display:grid; grid-template-columns:repeat(9,1fr); font-size:11px; color:var(--muted); text-align:center; margin-top:2px; }
.final .fscore { font-size:30px; margin-bottom:8px; }
.duel { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; text-align:center; background:var(--panel2); border-radius:14px; padding:12px 8px 8px; }
.duel b { display:block; font:800 56px/1 "Bricolage Grotesque", sans-serif; font-variant-numeric:tabular-nums; }
.duel span { font-size:13px; color:var(--muted); }
.duel .vsw { font-size:14px; color:var(--muted); padding:0 6px; }
.headline { font-size:16px; font-weight:500; }
.hero { padding:28px 8px 14px; }
.hero h1 { font-size:40px; line-height:1.05; margin:14px 0 6px; }
.featured { border:2px solid var(--hi); }
.featured h2 { margin:6px 0 2px; }
.quietdemo .act { background:transparent; border:1px solid var(--line); color:var(--text); }
.steps .step3 { padding:8px 0; border-top:1px solid rgba(255,255,255,.07); }
.steps .step3:first-of-type { border-top:0; }
.steps .step3 p { margin:2px 0 0; font-size:14px; color:var(--muted); }
details.more summary { font-weight:600; color:var(--text); }
@keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes stamp { 0% { transform:scale(1); } 40% { transform:scale(1.015); } 100% { transform:scale(1); } }
@keyframes slide { from { left:var(--from); } }
.flash.rise { animation:rise 220ms ease-out; }
.callcard.stamp { animation:stamp 180ms ease-out; }
.dot.slide { animation:slide 600ms ease-out; }

@media (max-width:380px) { .score b { font-size:26px; } .paceHero b { font-size:46px; } .duel b { font-size:46px; } .mixrow .mx b { font-size:16px; } }

<body>
<div id="app"></div>
<script>
/* kK engine: pure logic shared by the app and the tests. */
const KKE = (() => {
  // ---------- pitch vocabulary ----------
  const FAMILY = { FF:"fastball", SI:"fastball", FC:"fastball", FA:"fastball", FT:"fastball",
    SL:"breaking", ST:"breaking", CU:"breaking", KC:"breaking", SV:"breaking", CS:"breaking",
    CH:"offspeed", FS:"offspeed", FO:"offspeed", SC:"offspeed", KN:"offspeed", EP:"offspeed" };
  const TYPE_NAME = { FF:"four-seam fastball", SI:"sinker", FC:"cutter", FA:"fastball", FT:"two-seam fastball",
    SL:"slider", ST:"sweeper", CU:"curveball", KC:"knuckle curve", SV:"slurve", CS:"slow curve",
    CH:"changeup", FS:"splitter", FO:"forkball", SC:"screwball", KN:"knuckleball", EP:"eephus" };
  const SHORT = { FF:"Four-seam", SI:"Sinker", FC:"Cutter", FA:"Fastball", FT:"Two-seam", SL:"Slider", ST:"Sweeper", CU:"Curveball",
    KC:"Knuckle curve", SV:"Slurve", CS:"Slow curve", CH:"Changeup", FS:"Splitter", FO:"Forkball", SC:"Screwball", KN:"Knuckleball", EP:"Eephus" };
  const FAM_NAME = { fastball:"Fastball", breaking:"Breaking ball", offspeed:"Offspeed" };
  const LOC_NAME = { up:"Up", down:"Down", off:"Off the plate" };
  const LOC_WORDS = { up:"up", down:"down", off:"off the plate" };
  const ADV = ["H-in","H-mid","H-away","M-in","M-mid","M-away","L-in","L-mid","L-away","C-high","C-low","C-in","C-away"];
  const ADV_NAME = { "H-in":"High in", "H-mid":"High middle", "H-away":"High away", "M-in":"Middle in", "M-mid":"Middle", "M-away":"Middle away",
    "L-in":"Low in", "L-mid":"Low middle", "L-away":"Low away", "C-high":"Chase high", "C-low":"Chase low", "C-in":"Chase in", "C-away":"Chase away" };
  const fam = t => FAMILY[t] || null;
  const HALF_PLATE = 0.83; // feet: half of 17 inches plus the ball's radius

  // ---------- location ----------
  // Where a pitch crossed, relative to the hitter. Returns { base, adv } or null.
  function spotOf(pd, hand){
    if (!pd) return null;
    const c = pd.coordinates || {}, top = pd.strikeZoneTop, bot = pd.strikeZoneBottom;
    if (c.pX != null && c.pZ != null && top && bot) {
      const x = c.pX, z = c.pZ;
      const inside = hand === "L" ? x > 0 : x < 0;
      const dz = z > top ? z - top : z < bot ? bot - z : 0;
      const dx = Math.max(0, Math.abs(x) - HALF_PLATE);
      const mid = (top + bot) / 2;
      if (dz === 0 && dx === 0) {
        const row = z > bot + (top-bot)*2/3 ? "H" : z < bot + (top-bot)/3 ? "L" : "M";
        const col = Math.abs(x) <= HALF_PLATE/3 ? "mid" : inside ? "in" : "away";
        return { base: z >= mid ? "up" : "down", adv: row + "-" + col };
      }
      if (dx > dz) return { base:"off", adv: inside ? "C-in" : "C-away" };
      return { base: z >= mid ? "up" : "down", adv: z > top ? "C-high" : "C-low" };
    }
    // Fallback to the Gameday zone number (catcher's view).
    const zn = pd.zone; if (zn == null) return null;
    if (zn >= 11) return { base: zn <= 12 ? "up" : "down", adv: zn <= 12 ? "C-high" : "C-low" };
    if (zn < 1 || zn > 9) return null;
    const r = Math.floor((zn-1)/3), cc = (zn-1)%3;
    const leftIsInside = hand !== "L"; // a right-handed hitter stands on the catcher's left
    const col = cc === 1 ? "mid" : (cc === 0) === leftIsInside ? "in" : "away";
    return { base: r === 2 ? "down" : "up", adv: ["H","M","L"][r] + "-" + col };
  }
  function advPartial(call, actual){
    if (!call || !actual) return 0;
    if (call === actual) return 1;
    const [cr, cc] = call.split("-"), [ar, ac] = actual.split("-");
    // Half credit for the right row or column inside the zone. Chase cells must be exact.
    if (cr !== "C" && ar !== "C") return (cr === ar || cc === ac) ? 0.5 : 0;
    return 0;
  }

  // ---------- counts ----------
  function bucket(balls, strikes){
    if (balls === 3 && strikes === 2) return "full";
    if (strikes >= 2) return "two";
    if (balls === 0 && strikes === 0) return "first";
    if (balls === 0 && strikes === 1) return "ahead";
    if (balls === strikes) return "even";
    return "behind";
  }
  const BUCKET_NAME = { first:"on the first pitch", ahead:"at 0-1", even:"in even counts", behind:"in hitter's counts", two:"with two strikes", full:"at 3-2" };

  // ---------- book ----------
  function emptyCell(){ return { n:0, type:{}, fam:{}, base:{}, adv:{} }; }
  function newBook(id, name){ return { id, name, n:0, cells:{}, fps:{n:0,s:0}, velo:{}, games:0 }; }
  function bookAdd(book, hand, bkt, type, spot, speed){
    const f = fam(type); if (!f) return;
    for (const key of [hand+"|"+bkt, hand+"|*", "*|"+bkt, "*|*"]) {
      const c = book.cells[key] || (book.cells[key] = emptyCell());
      c.n++; c.type[type]=(c.type[type]||0)+1; c.fam[f]=(c.fam[f]||0)+1;
      if (spot) { c.base[spot.base]=(c.base[spot.base]||0)+1; c.adv[spot.adv]=(c.adv[spot.adv]||0)+1; }
    }
    if (speed) { const v = book.velo[type] || (book.velo[type] = { s:0, n:0 }); v.s += speed; v.n++; }
    book.n++;
  }
  function bookCell(book, hand, bkt){
    if (!book) return null;
    for (const key of [hand+"|"+bkt, hand+"|*", "*|"+bkt, "*|*"]) { const c = book.cells[key]; if (c && c.n >= 15) return { cell:c, key }; }
    const c = book.cells["*|*"]; return c && c.n ? { cell:c, key:"*|*" } : null;
  }
  // A league-style stand-in for pitchers with no book yet.
  function genericBook(){
    const b = newBook(0, "League average");
    const mix = { first:{FF:.58,SL:.22,CH:.12,CU:.08}, ahead:{FF:.45,SL:.28,CH:.14,CU:.13}, even:{FF:.50,SL:.24,CH:.15,CU:.11},
      behind:{FF:.66,SL:.16,CH:.13,CU:.05}, two:{FF:.42,SL:.32,CH:.13,CU:.13}, full:{FF:.62,SL:.22,CH:.12,CU:.04} };
    const spots = { fastball:{ "H-in":.10,"H-mid":.08,"H-away":.10,"M-in":.06,"M-mid":.05,"M-away":.08,"L-in":.05,"L-mid":.04,"L-away":.08,"C-high":.12,"C-low":.04,"C-in":.08,"C-away":.12 },
      other:{ "H-in":.03,"H-mid":.03,"H-away":.04,"M-in":.04,"M-mid":.04,"M-away":.07,"L-in":.06,"L-mid":.06,"L-away":.11,"C-high":.03,"C-low":.25,"C-in":.06,"C-away":.18 } };
    const baseOf = a => a === "C-in" || a === "C-away" ? "off" : (a[0] === "L" || a === "C-low") ? "down" : "up";

      const sp = spots[fam(t) === "fastball" ? "fastball" : "other"];
      for (const a in sp) { const n = Math.round(mix[bkt][t] * sp[a] * 400); for (let i = 0; i < n; i++) bookAdd(b, hand, bkt, t, { base: baseOf(a), adv: a }); }

    return b;
  }
  function prob(map, k, n, kinds){ return ((map[k]||0) + 0.5) / (n + 0.5*kinds); }
  function argmax(map, area){ let best=null, v=-1; for (const k in map) { const x = map[k] / (area ? (area[k] || 1) : 1); if (x > v){ v=x; best=k; } } return best; }

  const AREA = { "C-high":3, "C-low":3, "C-in":3, "C-away":3 };
  function arsenal(book){
    const c = book && book.cells["*|*"]; if (!c || !c.n) return ["FF","SL","CH","CU"];
    return Object.keys(c.type).filter(t => c.type[t]/c.n >= 0.03).sort((a,b)=>c.type[b]-c.type[a]);
  }
  function mixLine(book, hand, bkt, level){
    const bc = bookCell(book, hand, bkt); if (!bc) return { pitch:[], spot:[], key:null, n:0 };
    const c = bc.cell, top = (map, n) => Object.keys(map).sort((a,b)=>map[b]-map[a]).slice(0,n).map(k => ({ k, pct: Math.round(100*map[k]/c.n) }));
    return level === "advanced" ? { pitch: top(c.type, 3), spot: top(c.adv, 3), key: bc.key, n:c.n } : { pitch: top(c.fam, 3), spot: top(c.base, 3), key: bc.key, n:c.n };
  }
  function bookCall(book, hand, bkt, level){
    const bc = bookCell(book, hand, bkt);
    if (!bc) return level === "advanced" ? { pitch:"FF", spot:"H-away" } : { pitch:"fastball", spot:"up" };
    const c = bc.cell;
    return level === "advanced" ? { pitch: argmax(c.type) || "FF", spot: argmax(c.adv, AREA) || "M-away" } : { pitch: argmax(c.fam) || "fastball", spot: argmax(c.base) || "up" };
  }
  function weights(book, hand, bkt, level, call){
    const bc = bookCell(book, hand, bkt);
    if (!bc) return { wp:1.5, ws:1.5 };
    const c = bc.cell;
    const pp = level === "advanced" ? prob(c.type, call.pitch, c.n, Math.max(3, Object.keys(c.type).length)) : prob(c.fam, call.pitch, c.n, 3);
    const ps = level === "advanced" ? prob(c.adv, call.spot, c.n, 13) : prob(c.base, call.spot, c.n, 3);
    return { wp: Math.min(5, 1/pp), ws: Math.min(5, 1/ps) };
  }
  // Grade a call against the pitch. The glove answer never affects the grade.
  function grade(call, actual, level){
    const pitchRight = level === "advanced" ? call.pitch === actual.type : call.pitch === fam(actual.type);
    let spotCredit = 0;
    if (actual.spot) spotCredit = level === "advanced" ? advPartial(call.spot, actual.spot.adv) : (call.spot === actual.spot.base ? 1 : 0);
    return { pitchRight, spotCredit };
  }
  function pointsFor(g, w, big){
    let p = (g.pitchRight ? w.wp : 0) + g.spotCredit * w.ws;
    if (g.pitchRight && g.spotCredit === 1) p += 1;
    return Math.round(p * (big ? 2 : 1) * 10) / 10;
  }

  // ---------- Monte Carlo run engine ----------
  const BASE = { bb:0.090, s1:0.142, s2:0.044, s3:0.004, hr:0.031 };
  function paProbs(factor){
    const on = BASE.bb+BASE.s1+BASE.s2+BASE.s3+BASE.hr;
    // factor is a run multiplier (1 = league average); runs scale with roughly the 2.5 power of on-base rates.
    const f = Math.max(0.35, Math.min(2.4, factor || 1));
    const scale = Math.min(0.62/on, 1.04 * Math.pow(f, 0.4));
    return { bb:BASE.bb*scale, s1:BASE.s1*scale, s2:BASE.s2*scale, s3:BASE.s3*scale, hr:BASE.hr*Math.pow(scale,1.25) };
  }
  function rng(seed){ let s = seed>>>0 || 1; return () => { s ^= s<<13; s>>>=0; s ^= s>>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
  function halfInning(team, state, R, maxRunsWalkoff){
    let outs = state.outs||0, bases = state.bases||0, runs = 0, i = team.idx;
    while (outs < 3) {
      const p = team.factor(i % 9, team.faced++).p; const r = R();
      let c = 0;
      if (r < (c += p.bb)) { if (bases & 1) { if (bases & 2) { if (bases & 4) runs++; bases |= 4; } bases |= 2; } bases |= 1; }
      else if (r < (c += p.s1)) { let nb = 1; if (bases & 4) runs++; if (bases & 2) { if (R() < 0.6) runs++; else nb |= 4; } if (bases & 1) { if (!(nb & 4) && R() < 0.28) nb |= 4; else nb |= 2; } bases = nb; }

      else if (r < (c += p.s3)) { runs += ((bases&1)?1:0)+((bases&2)?1:0)+((bases&4)?1:0); bases = 4; }
      else if (r < (c += p.hr)) { runs += 1 + ((bases&1)?1:0)+((bases&2)?1:0)+((bases&4)?1:0); bases = 0; }

          if (bases & 4 && R() < 0.30) { runs++; bases &= ~4; }
          if (bases & 1 && R() < 0.11) { outs++; bases &= ~1; }
          else if (bases & 2 && !(bases & 4) && R() < 0.22) { bases = (bases & ~2) | 4; }
        }
      }
      i++;

  }
  /* st = { inning, top, outs, bases, away, home, ghost }
     teams.away/home: { idx, offense:[9 run factors], pitching:{ current, remaining (batters), pen } }; pitching is that team's own staff. */
  function simulate(st, teams, n, seed){
    const R = rng(seed || 12345);
    let awayWins = 0;
    for (let k = 0; k < n; k++) {
      let inning = st.inning, top = st.top, outs = st.outs||0, bases = st.bases||0, away = st.away, home = st.home;
      const bat = { away:{ idx: teams.away.idx }, home:{ idx: teams.home.idx } };
      const arm = { away:{ left: teams.away.pitching.remaining }, home:{ left: teams.home.pitching.remaining } };
      let guard = 0;
      while (guard++ < 40) {
        const side = top ? "away" : "home", def = top ? "home" : "away";
        const T = teams[side], D = teams[def];
        const team = { idx: bat[side].idx, faced:0, factor: (slot) => { const pf = arm[def].left > 0 ? D.pitching.current : D.pitching.pen; arm[def].left--; return { p: paProbs(T.offense[slot] * pf) }; } };
        if (outs === 0 && bases === 0 && inning > 9 && st.ghost) bases = 2;
        const walkoff = (!top && inning >= 9) ? (away - home) : null;
        const r = halfInning(team, { outs, bases }, R, walkoff);
        bat[side].idx = team.idx;
        if (top) away += r; else home += r;
        outs = 0; bases = 0;
        if (top) { top = false; if (inning >= 9 && home > away) break; }
        else { if (inning >= 9 && home !== away) break; top = true; inning++; if (inning > 15) { if (R() < 0.5) away = home + 1; else home = away + 1; break; } }
      }
      if (away > home) awayWins++;
    }

  }

  // ---------- Pythagorean foundation ----------
  function pyth(rs, ra, exp){ exp = exp || 1.83; return Math.pow(rs,exp)/(Math.pow(rs,exp)+Math.pow(ra,exp)); }
  // Regress a pitcher's ERA toward the league by innings pitched.
  function regressERA(era, ip, lg){ if (!era || !ip) return null; const w = ip / (ip + 80); return w * era + (1 - w) * lg / 1.08; }
  function pythPregame(f){
    const share = 5.5/9;
    const prevent = s => share * (s.starterERA ? s.starterERA * 1.08 : s.ra) + (1 - share) * s.ra;
    const awayRuns = f.away.rs * prevent(f.home) / f.lg, homeRuns = f.home.rs * prevent(f.away) / f.lg;
    const pAway = pyth(awayRuns, homeRuns) - 0.035;
    return { pAway: Math.max(0.05, Math.min(0.95, pAway)), awayRuns, homeRuns };
  }
  const logit = p => Math.log(p/(1-p));
  const sigm = x => 1/(1+Math.exp(-x));
  function shiftWP(mlbAway, mlbAway0, pythAway, outsRecorded){
    const clamp = p => Math.min(0.995, Math.max(0.005, p));
    if (mlbAway >= 0.999 || mlbAway <= 0.001) return mlbAway;
    const delta = logit(clamp(pythAway)) - logit(clamp(mlbAway0));
    const rem = Math.max(0, (54 - outsRecorded) / 54);
    return sigm(logit(clamp(mlbAway)) + delta * rem);
  }

  // ---------- what the fan has seen ----------
  function ts(x){ return x ? Date.parse(x) : NaN; }
  function view(feed, t){
    const all = (feed.liveData && feed.liveData.plays && feed.liveData.plays.allPlays) || [];
    const plays = [];
    for (const p of all) {
      if (!(ts(p.about.startTime) <= t)) break;
      const pe = p.playEvents || [];
      const evs = pe.filter(e => !(ts(e.startTime) > t));
      const lastEv = pe[pe.length-1];
      const complete = !!p.about.isComplete && evs.length === pe.length && (!lastEv || ts(lastEv.startTime) <= t);
      plays.push({ src:p, evs, complete, pitches: evs.filter(e => e.isPitch) });

  }
  // The latest count, from any event that carries one (pitch-clock violations and overturned challenges included).
  function lastCount(evs){ for (let j = evs.length-1; j >= 0; j--) if (evs[j].count) return evs[j].count; return null; }

    const pv = prevPlay(plays, cur);
    if (!sameHalf(pv, cur)) return 0;
    const lc = lastCount(pv.evs); if (lc && lc.outs >= 3) return 0;
    return basesAfter(pv.src);
  }
  function outsBefore(plays, cur){
    const pv = prevPlay(plays, cur);
    if (!sameHalf(pv, cur)) return 0;
    const lc = lastCount(pv.evs); return lc ? lc.outs % 3 : 0;
  }
  function stateOf(plays){
    let away=0, home=0, inning=1, top=true, outs=0, bases=0, cur=null;
    for (const v of plays) {
      if (v.complete) { away = v.src.result.awayScore; home = v.src.result.homeScore; }
      inning = v.src.about.inning; top = v.src.about.halfInning === "top"; cur = v;
    }
    let balls=0, strikes=0;
    if (cur) {
      if (!cur.complete) {
        const lc = lastCount(cur.evs);
        if (lc) { balls = Math.min(3, lc.balls); strikes = Math.min(2, lc.strikes); outs = lc.outs; } else outs = outsBefore(plays, cur);
        bases = basesBefore(plays, cur);

  }
  // The count before each pitch of a play.
  function pitchStates(src){
    const out = []; let b = 0, s = 0;
    for (const e of src.playEvents || []) {
      if (e.isPitch) out.push({ e, balls:b, strikes:s });

  }
  // Half-innings the fan has seen end. A finished game closes its last half even without three outs.
  function completedHalves(plays, final){

      if (!leadsNow) idx = null;

  }

  // ---------- sync ----------
  // taps: wall-clock ms at three releases in a row. starts: pitch start times from the feed.
  // Prefer three consecutive pitches whose spacing matches the taps, and take the smallest delay that fits.
  function syncOffset(taps, starts){
    if (taps.length < 2 || !starts.length) return null;
    const st = starts.slice().sort((a,b)=>a-b), k = taps.length, cands = [];
    for (let j = 0; j + k <= st.length; j++) {
      const d = taps.map((t, i) => t - st[j+i]).sort((a,b)=>a-b);
      const med = d[Math.floor(k/2)];
      if (d[k-1] - d[0] <= 2500 && med >= -5000 && med <= 150000) cands.push({ med, spread: d[k-1] - d[0] });
    }
    if (cands.length) {
      // Best fit wins; when two runs of pitches fit about equally well, take the smaller delay.
      const best = Math.min.apply(null, cands.map(c => c.spread));
      return Math.min.apply(null, cands.filter(c => c.spread <= best + 250).map(c => c.med));
    }

    for (let j = 0; j < st.length; j++) {

      let worst = 0;
      for (let i = 1; i < k; i++) { const target = taps[i] - d0; let near = Infinity; for (const x of st) near = Math.min(near, Math.abs(x - target)); worst = Math.max(worst, near); }

  }

  // ---------- keys ----------
  const ON_BASE = new Set(["single","double","triple","home_run","walk","intent_walk","hit_by_pitch","field_error","catcher_interf"]);
  const HITS = new Set(["single","double","triple","home_run"]);
  const XBH = new Set(["double","triple","home_run"]);

              count:{ balls:Math.min(balls,4), strikes:Math.min(strikes,3), outs }, pitchData: pd, hitData: hit ? { launchSpeed: hit.ls, launchAngle: hit.la } : undefined,
              index: events.length, pitchNumber, startTime: iso(t), endTime: iso(t+3000), isPitch:true, type:"pitch" });
          }
          // advance runners
          let runs = 0; const b = bases, nb = [null,null,null];
          const adv = (n) => { // force/advance n bases for everyone
            for (let i = 2; i >= 0; i--) if (b[i]) { const to = i + n; if (to >= 3) runs++; else nb[to] = b[i]; } };
          let isOut = false;
          if (result === "walk" || result === "hit_by_pitch") { nb[0]=batter; nb[1]=b[1]; nb[2]=b[2]; if (b[0]) { if (b[1]) { if (b[2]) runs++; nb[2]=b[1]; } nb[1]=b[0]; } }
          else if (result === "single") { adv(1); if (nb[2] && R()<0.6) { runs++; nb[2]=null; } nb[0]=batter; }
          else if (result === "double") { adv(2); if (nb[2] && R()<0.42) { runs++; nb[2]=null; } nb[1]=batter; }
          else if (result === "triple") { adv(3); nb[2]=batter; }
          else if (result === "home_run") { adv(4); runs++; }
          else { isOut = true; outs++; nb[0]=b[0]; nb[1]=b[1]; nb[2]=b[2];
            if (result === "field_out" && outs < 3 && b[2] && R() < 0.3) { runs++; nb[2]=null; result = "sac_fly"; } }
          bases = nb;
          if (top) away += runs; else home += runs;
          arm[def].runs += runs;
          events[events.length-1].count.outs = outs;
          const evName = { single:"Single", double:"Double", triple:"Triple", home_run:"Home Run", walk:"Walk", hit_by_pitch:"Hit By Pitch", strikeout:"Strikeout", field_out:"Flyout", sac_fly:"Sac Fly" }[result];
          const verb = { single:"singles", double:"doubles", triple:"triples", home_run:"homers", walk:"walks", hit_by_pitch:"is hit by a pitch", strikeout:"strikes out", field_out:"flies out", sac_fly:"hits a sacrifice fly" }[result];
          allPlays.push({
            result:{ type:"atBat", event: evName, eventType: result, description:`${batter.fullName} ${verb}${result === "home_run" ? (runs > 1 ? `, and ${runs - 1} more ${runs - 1 === 1 ? "run scores" : "runs score"}` : "") : runs ? (runs === 1 ? ", and a run scores" : `, and ${runs} runs score`) : ""}.`, rbi:runs, awayScore:away, homeScore:home, isOut },
            about:{ atBatIndex: ab++, halfInning: top?"top":"bottom", isTopInning: top, inning, startTime: iso(playStart), endTime: iso(t), isComplete:true },
            count:{ balls, strikes, outs },
            matchup:{ batter:{id:batter.id, fullName:batter.fullName}, batSide:{code:batHand}, pitcher:{id:pitcher.id, fullName:pitcher.fullName}, pitchHand:{code:pitcher.pitchHand.code},
              postOnFirst: bases[0]?{id:bases[0].id}:undefined, postOnSecond: bases[1]?{id:bases[1].id}:undefined, postOnThird: bases[2]?{id:bases[2].id}:undefined },
            playEvents: events
          });
          if (!box[def].pitchers.includes(pitcher.id)) box[def].pitchers.push(pitcher.id);
          order[bat]++;
          t += 20000;
          if (!top && inning >= 9 && home > away) break;
        }
        if (!top && inning >= 9 && home !== away) break;
      }
      if (inning >= 9 && home !== away) break;
    }
    return {
      gamePk: 1, demo: true,
      gameData:{ game:{ pk:1, type:"D" }, datetime:{ dateTime: iso(t0) }, status:{ abstractGameState:"Live", detailedState:"In Progress" },
        teams:{ away:{ id:ATL.id, name:ATL.name, teamName:ATL.teamName, abbreviation:ATL.abbreviation }, home:{ id:LAD.id, name:LAD.name, teamName:LAD.teamName, abbreviation:LAD.abbreviation } },
        players, probablePitchers:{ away:{ id:ATL.starter.id, fullName:ATL.starter.fullName }, home:{ id:LAD.starter.id, fullName:LAD.starter.fullName } } },
      liveData:{ plays:{ allPlays }, boxscore:{ teams: box } },
      standings: { lg: LG.rpg, teams: { 144:{ rs:ATL.rs, ra:ATL.ra }, 119:{ rs:LAD.rs, ra:LAD.ra } } },
      t0
    };
  }
  function inPlay(m, inZone, R){
    const pHit = Math.min(0.48, 0.33 * Math.pow(m, 0.35) * (inZone ? 1.05 : 0.8));
    const ls = Math.round((inZone ? 88 : 82) + (R()-0.4)*30);
    if (R() < pHit) {
      const r = R(), hr = 0.10 * Math.pow(m,0.5) * (inZone?1.2:0.6);
      const ev = r < hr ? "home_run" : r < hr + 0.2 ? "double" : r < hr + 0.22 ? "triple" : "single";
      return { ev, ls: Math.max(ls, ev==="home_run"?100:ev==="double"?94:85) + Math.round(R()*6), la: ev==="home_run"?28:14 };
    }
    return { ev:"field_out", ls, la: Math.round(R()*50-10) };
  }
  // Books built straight from each demo pitcher's profile (stand-in for a season of pitch logs).
  function books(){
    const R = E.rng(777), out = {};
    for (const T of [ATL, LAD]) for (const p of [T.starter, ...T.pen]) {
      const bk = E.newBook(p.id, p.fullName);
      for (let i = 0; i < 2600; i++) {
        const hand = R() < 0.5 ? "L" : "R";
        const bkt = ["first","ahead","even","behind","two","two","full"][Math.floor(R()*7)];
        const type = pickType(p, bkt, hand, R, []);
        const pd = pickLoc(type, bkt, R, hand, []);
        E.bookAdd(bk, hand, bkt, type, E.spotOf(pd, hand), (p.velo[type]||90) + (R()-0.5)*2);
        if (bkt === "first") { bk.fps.n++; if (pd.zone <= 9 || R() < 0.3) bk.fps.s++; }
      }
      bk.games = 30;
      out[p.id] = bk;
    }
    return out;
  }
  return { generate, books, LG };
})();

function virtualClock(firstMs){

    <div class="scale"><span>0%</span><span>Marker: pregame line</span><span>100%</span></div>
    <p class="pline">${esc(sentence)}</p>${engines}
    <div class="k">The shape of the game</div><div class="strip"><div class="axis"></div>${bars.join("")}</div><div class="innings" style="grid-template-columns:repeat(${n/2},1fr)" aria-hidden="true">${inn.join("")}</div>
    <p class="foot">One bar per half-inning. Bars above the line mean the ${esc(me)} were ahead of the pregame line, and bars below mean they were behind it. The chance naturally dips after the ${esc(me)} bat without scoring and rises after they hold the other team, so a zigzag is normal.</p></section>
  <section class="card"><h3>${over ? "Biggest swings" : "Biggest swings so far"}</h3>${sw.length ? sw.map(s => `<div class="swing"><b class="${s.d>=0?"ok":"no"}">${s.d>=0?"+":"−"}${Math.abs(Math.round(s.d))}</b> ${esc(abText(s.v))}.</div>`).join("") : `<p class="foot">Swings appear as half-innings finish.</p>`}</section>`;
}

// ---------- keys tab ----------
function keysTab(plays, over){
  const cat = E.keyCatalog(keyCtx()), s = statsNow(plays);
  if (!A.rec.keysLocked) {
    return `<section class="card"><h2>Keys to the Game</h2><p>Pick three. Each one is graded straight from the game data, through five innings and at the final out.</p>
      ${cat.map(k => `<button class="keypick ${A.rec.keys.includes(k.id)?"on":""}" aria-pressed="${A.rec.keys.includes(k.id)}" data-act="key" data-v="${k.id}">${A.rec.keys.includes(k.id) ? "✓ " : ""}${esc(k.text)}</button>`).join("")}
      <p class="foot" role="status">${A.keyMsg ? esc(A.keyMsg) + " " : ""}${A.rec.keys.length} of 3 picked. Keys lock at the first pitch, and any empty slot is filled for you.</p></section>`;
  }
  const inn = inningsDone(plays);
  const rows = A.rec.keys.map(id => { const k = cat.find(x=>x.id===id); const g = E.gradeKey(k, s, over ? "final" : "live", inn); const f5 = A.rec.five && A.rec.five.find(x=>x.id===id);
    const cls = ["Hit","On track","Clinched"].includes(g.status) ? "won" : g.status==="Too close to call" ? "close" : "lost";
    return `<div class="key ${cls}"><b>${esc(g.status)}:</b> ${esc(k.text)}<div class="foot">${esc(cap(g.show))}.${f5 ? ` Through five innings it was ${esc(f5.status.toLowerCase())}.` : ""}</div></div>`; }).join("");
  return `<section class="card"><h2>Your keys</h2>${rows}<p class="foot">The status updates as you watch. The official grades come through five innings and at the final out.</p></section>`;
}

// ---------- season tab ----------
function seasonTab(){
  const sea = S.get("kk-season", { games:[], pitchers:{}, glove:{}, keys:{}, reads:[] });
  const seg = A.seg || "read", segs = [["read","Pitchers you can read"],["glove","Your eye on command"],["keys","Keys record"]];
  const real = sea.games.filter(g => !g.demo), use = real.length ? real : sea.games;
  const tot = use.reduce((a,g) => { a.n += g.line.n; a.ag += g.line.against||0; a.agy += g.line.againstYou||0; a.agb += g.line.againstBook||0; return a; }, { n:0, ag:0, agy:0, agb:0 });
  let body = "";
  if (seg === "read") {
    const edge = p => ((p.againstYou||0) - (p.againstBook||0)) / Math.max(1, p.against||0);
    const ps = Object.values(sea.pitchers).filter(p => p.n >= 5).sort((a,b) => edge(b) - edge(a));
    body = ps.length ? `<table><thead><tr><th>Pitcher</th><th>Calls</th><th>Pitch right</th><th>Against the book</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.n}</td><td>${Math.round(100*p.you/p.n)}%</td><td>${p.against ? `${p.againstYou||0} of ${p.against} (book ${p.againstBook||0})` : "None yet"}</td></tr>`).join("")}</tbody></table>
      <p class="foot">Sorted by how often your calls against the book beat it. A pitcher appears after five calls${ps.some(p => p.n >= 25) ? "" : ", and your read on a pitcher becomes reliable after about 25"}.</p>`
      : `<p class="foot">Call pitches in a live game or a replay, and the pitchers you can read will show up here.</p>`;
    const rd = (sea.reads||[]).slice(-5).reverse();
    if (rd.length) body += `<h3>Best reads</h3>${rd.map(r => `<div class="gp foot">${esc(fmtDate(r.date))}: ${esc(r.text)}</div>`).join("")}`;
  } else if (seg === "glove") {
    const gs = Object.values(sea.glove);
    body = gs.length ? `<p class="foot">These charts come from your own answers to "Hit the glove?", so they are your read of each pitcher's command.</p>` + gs.map(g => `<div class="gp"><b>${esc(g.name)}</b>${Object.entries(g.types).map(([t,x])=>`<div class="cmd"><span>${esc(E.SHORT[t]||t)}</span><span class="cbar2" role="img" aria-label="Hit the glove on ${x.hit} of ${x.n}"><i style="width:${100*x.hit/x.n}%"></i></span><span class="foot">${x.hit} of ${x.n}</span></div><div class="foot">${x.miss ? `He missed his spot on ${x.miss} of the ${x.n} ${esc(E.tn(t))}${x.n===1?"":"s"} you charted${x.missHard ? `, and ${x.missHard} of those misses ${x.missHard===1?"was":"were"} hit 95 mph or harder` : ""}.` : `He hit the glove on every ${esc(E.tn(t))} you charted.`}</div>`).join("")}</div>`).join("")
      : `<p class="foot">Answer "Hit the glove?" after your calls, and each pitcher's command chart builds here.</p>`;
  } else {
    const ks = Object.values(sea.keys);
    body = ks.length ? ks.map(k => `<div class="key"><div>${esc(k.text)}</div><div class="foot">When it hit, your team went ${k.hitW}-${k.hitL}. When it missed, your team went ${k.missW}-${k.missL}.</div></div>`).join("") : `<p class="foot">Your keys, and how your team did when each one hit, collect here.</p>`;
  }
  const gl = sea.games.slice(-8).reverse();
  return `<section class="card"><h2>Your season</h2>${sea.games.length ? `<p class="foot">${plural(use.length,"game")}${real.length ? "" : " (demo)"} and ${plural(tot.n,"call")}. Against the book you were right ${tot.agy} of ${tot.ag} times, and the book was right ${plural(tot.agb,"time")}.</p>` : ""}
    <div class="seg" role="group">${segs.map(([k,n])=>`<button class="${seg===k?"on":""}" aria-pressed="${seg===k}" data-act="seg" data-v="${k}">${n}</button>`).join("")}</div>${body}</section>
    <section class="card"><h3>Games</h3>${gl.length ? gl.map(g=>`<div class="gp"><b>${g.won?"W":"L"} ${g.my}-${g.op} vs ${esc(g.opp)}${g.demo ? " (demo)" : ""}</b> <span class="foot">${esc(fmtDate(g.date))}. ${g.line.against ? `Against the book, you were right ${g.line.againstYou} of ${g.line.against} times and the book was right ${g.line.againstBook}.` : `${g.line.you} of ${g.line.n} pitches right.`}</span></div>`).join("") : `<p class="foot">Finished games land here.</p>`}
    <p class="foot">Your season is saved on this phone. Use Export in Settings to keep a copy, and add kK to your Home Screen so it opens like an app.</p></section>`;
}
function fmtDate(d){ try { return new Date(d + "T12:00:00").toLocaleDateString([], { month:"short", day:"numeric" }); } catch(e){ return d; } }

// ---------- settings ----------
function sheet(){
  const c = settings.colors, opt = (k, v, label) => `<button class="${settings[k]===v?"on":""}" aria-pressed="${settings[k]===v}" data-act="set" data-k="${k}" data-v="${v}">${label}</button>`;
  return `<div class="sheet" role="dialog" aria-label="Settings"><div class="sheetin"><h2>Settings</h2>
    <label>Call level</label><div class="pills">${opt("level","base","Base: kind of pitch and spot")}${opt("level","advanced","Advanced: exact pitch and spot")}</div>
    <label>Call pitches for</label><div class="pills">${opt("seat","mine","My team's pitchers")}${opt("seat","both","Both teams")}</div>
    <label>How many windows</label><div class="pills">${opt("allTwo",false,"Up to two per at-bat")}${opt("allTwo",true,"Every two-strike pitch")}</div>
    <label>Ask "Hit the glove?"</label><div class="pills">${opt("glove",true,"Yes")}${opt("glove",false,"No")}</div>
    <label>Advanced grid</label><div class="pills">${opt("view","tv","TV view")}${opt("view","catcher","Catcher's view")}</div>
    <label>Team colors</label><div class="colors"><input type="color" aria-label="Primary color" data-col="p" value="${c.p}"><input type="color" aria-label="Secondary color" data-col="s" value="${c.s}"><input type="color" aria-label="Accent color" data-col="t" value="${c.t}"><button class="ghost" data-act="resetcolors">Braves colors</button></div>
    <label for="printIn">Your own pregame win chance (optional)</label><input class="txt" id="printIn" inputmode="decimal" placeholder="For example 38" value="${esc(settings.print)}"><p class="foot">If you enter your own percentage for your team, it replaces kK's pregame estimate for this game.</p>
    <label>Your season</label><div class="row"><button class="ghost" data-act="export">Export</button><label class="ghost filebtn">Import<input type="file" accept="application/json" id="importIn"></label><button class="ghost" data-act="cleardemo">Clear demo games</button></div>
    <div class="row"><button class="act" data-act="closesheet">Done</button><button class="ghost" data-act="newgame">Pick another game</button></div>
  </div></div>`;
}

// ---------- start screen ----------
async function renderStart(){
  const app = $("#app");
  if (A.startHtml) { app.innerHTML = A.startHtml; return; }
  app.innerHTML = `<div class="start"><div class="hero">${logo(132)}<h1>Call the pitch.</h1><p>Name it before it is thrown, beat the book, and learn how a pitcher really works.</p></div>
    <div id="games"><section class="card"><p class="foot">Looking for your team's games...</p></section></div>
    <section class="card demo" id="democard"><h3>Try it now</h3><p>Play a simulated game to learn how the calls work. The demo's results are invented.</p><button class="act wide" data-act="demo">Play a demo game</button></section>
    <section class="card how steps"><h3>How it works</h3>
      <div class="step3"><b>Call the pitch</b><p>When a call window opens, pick the pitch and where it will cross the plate before it is thrown.</p></div>
      <div class="step3"><b>Beat the book</b><p>The book is the pitcher's own habits this season. Go against it when the at-bat tells you to, and be right.</p></div>
      <div class="step3"><b>Build your season</b><p>Every game adds to the pitchers you can read, your eye on their command, and your keys record.</p></div></section>
    <details class="card more"><summary>Replay a game by its MLB game ID</summary><div class="row"><input class="txt" id="pkIn" inputmode="numeric" aria-label="MLB game ID" placeholder="Game ID"><button class="ghost" data-act="replaypk">Replay</button></div></details></div>`;
  A.startHtml = app.innerHTML;
  await loadSchedule();
}
async function loadSchedule(){
  const el = () => $("#games");
  try {
    const today = new Date(), fmt = d => d.toISOString().slice(0,10);
    const sch = await j(`/api/v1/schedule?sportId=1&teamId=${settings.team}&startDate=${fmt(new Date(today - 14*864e5))}&endDate=${fmt(new Date(+today + 4*864e5))}&hydrate=probablePitcher`);
    const games = []; for (const d of sch.dates||[]) for (const g of d.games) games.push(g);
    const live = games.filter(g => g.status.abstractGameState !== "Final").slice(0,3), done = games.filter(g => g.status.abstractGameState === "Final").slice(-6).reverse();
    const when = g => new Date(g.gameDate).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    const row = (g, act) => `<button class="gamebtn" data-act="${act}" data-pk="${g.gamePk}"><b>${esc(g.teams.away.team.name)} at ${esc(g.teams.home.team.name)}</b><span>${esc(when(g))}${g.status.abstractGameState === "Final" ? `. Final ${g.teams.away.score}-${g.teams.home.score}` : ""}</span></button>`;
    const feat = live[0];
    const featured = feat ? `<section class="card featured"><div class="k">${feat.status.abstractGameState === "Live" ? "On now" : "Next game"}${feat.seriesDescription && feat.gameType !== "R" ? ", " + esc(feat.seriesDescription) : ""}</div><h2>${esc(feat.teams.away.team.name)} at ${esc(feat.teams.home.team.name)}</h2><p class="foot">${esc(when(feat))}</p><button class="act wide" data-act="live" data-pk="${feat.gamePk}">Watch live</button></section>` : "";
    const html = featured + (live.length > 1 ? `<section class="card"><h3>Coming up</h3>${live.slice(1).map(g => row(g,"live")).join("")}</section>` : "") + (done.length ? `<section class="card"><h3>Replay a recent game</h3>${done.map(g => row(g,"replay")).join("")}</section>` : "");
    if (el()) el().innerHTML = html || `<section class="card"><p class="foot">No games found for your team in the last two weeks.</p></section>`;
    if (feat) { const dc = $("#democard"); if (dc) dc.classList.add("quietdemo"); }
  } catch(e) {
    if (el()) el().innerHTML = `<section class="card"><p>MLB's schedule didn't load.</p><p class="foot">Check your connection and try again, or play the demo game.</p><button class="ghost" data-act="retry">Try again</button></section>`;
  }
  A.startHtml = $("#app").innerHTML;
}
function bindStart(){}
async function startAction(b){
  const act = b.dataset.act;
  try {
    if (act === "demo") await startDemo();
    if (act === "live") await startLive(+b.dataset.pk);
    if (act === "replay") await startReplay(+b.dataset.pk);
    if (act === "replaypk") { const v = +$("#pkIn").value; if (v) await startReplay(v); }
    if (act === "retry") { const g = $("#games"); if (g) g.innerHTML = `<section class="card"><p class="foot">Looking for your team's games...</p></section>`; await loadSchedule(); }
  } catch(e) { alert("That game could not be loaded. " + e.message); }
}
function afterLoad(){ A.startHtml = null; A.tab = "game"; A.chip = null; A.flash = null; A.draft = null; A.lastWin = null; render(true); }

// ---------- events ----------
function bind(){
  document.querySelectorAll("#app [data-col]").forEach(i => i.oninput = () => { settings.colors[i.dataset.col] = i.value; saveSettings(); applyTheme(); });
  const pi = $("#printIn"); if (pi) pi.onchange = () => { settings.print = pi.value.trim(); saveSettings(); A.rec.pregame = null; A.rec.halves = []; A.rec.swings = []; render(true); };
  const im = $("#importIn"); if (im) im.onchange = () => { const f = im.files[0]; if (!f) return; f.text().then(t => { const d = JSON.parse(t); if (!d || !Array.isArray(d.games)) throw 0; S.set("kk-season", d); toast("Your season was imported."); }).catch(() => toast("That file is not a kK season export.")); };
}
function act(b){
  const a = b.dataset.act, v = b.dataset.v;
  if (a === "tab") { A.tab = b.dataset.tab; window.scrollTo(0,0); }
  else if (a === "settings") A.sheet = "settings";
  else if (a === "closesheet") A.sheet = null;
  else if (a === "set") { settings[b.dataset.k] = v === "true" ? true : v === "false" ? false : v; saveSettings(); A.draft = null; }
  else if (a === "resetcolors") { settings.colors = Object.assign({}, DEF.colors); saveSettings(); applyTheme(); }
  else if (a === "newgame") { A.feed = null; A.src = null; A.sheet = null; A.startHtml = null; return render(true); }
  else if (a === "play") { const first = A.src.clock.now() <= firstPitchMs(A.feed); A.src.clock.play(); if (first) { A.rec.keysLocked || (fillKeys(), A.rec.keysLocked = true, saveRec()); jumpToNextCall(); return; } }
  else if (a === "pause") { A.src.clock.pause(); A.autoPaused = null; }
  else if (a === "speed") A.src.clock.setSpeed(+v);
  else if (a === "jump") return jumpToNextCall();
  else if (a === "sync") return syncTap();
  else if (a === "resync") { A.rec.offset = null; A.rec.verified = false; A.syncTaps = []; A.syncPending = null; A.confirmOffset = null; A.verifyTap = null; saveRec(); }
  else if (a === "okoffset") { setOffset(A.confirmOffset); }
  else if (a === "openab") { A.rec.openAB = +b.dataset.ab; saveRec(); }
  else if (a === "skip") { A.skipped[b.dataset.k] = true; A.autoPaused = null; A.src.clock.play(); }
  else if (a === "coached") { settings.coached = true; saveSettings(); }
  else if (a === "cp" || a === "cs") {
    const d = A.draft || {};
    if (a === "cp") d.pitch = v; else d.spot = v;
    A.draft = d;
    if (d.pitch != null && d.spot != null) { if (!settings.coached) { settings.coached = true; saveSettings(); } return lockCall(); }
  }
  else if (a === "glove") return answerGlove(v);
  else if (a === "key") {
    const k = A.rec.keys; A.keyMsg = null;
    if (k.includes(v)) A.rec.keys = k.filter(x=>x!==v); else if (k.length < 3) k.push(v); else A.keyMsg = "You already have three. Unpick one to swap it.";
    saveRec();
  }
  else if (a === "seg") A.seg = v;
  else if (a === "cleardemo") { const sea = S.get("kk-season", null); if (sea) { sea.games = sea.games.filter(g=>!g.demo); sea.reads = (sea.reads||[]).filter(r=>!r.demo); for (const k of ["pitchers","glove","keys"]) for (const id in sea[k]) if (sea[k][id].demo) delete sea[k][id]; S.set("kk-season", sea); } toast("Demo games were cleared from your season."); return; }
  else if (a === "export") {
    const data = JSON.stringify(S.get("kk-season", { games:[] }));
    try { const url = URL.createObjectURL(new Blob([data], { type:"application/json" })); const l = document.createElement("a"); l.href = url; l.download = "kk-season.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast("Your season was saved as kk-season.json."); }
    catch(e){ prompt("Copy your season:", data); }
    return;
  }
  else if (a === "copy") {
    const t = shareText();
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("Copied. Paste it in the group chat."), () => { prompt("Copy your line:", t); });
    return;
  }
  render(true);
}

// ---------- boot ----------
const appEl = $("#app");
appEl.addEventListener("pointerdown", e => { if (e.target.closest("button, input, label, summary")) A.holdUntil = Date.now() + 450; });
appEl.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || !appEl.contains(b)) return;
  A.holdUntil = 0;
  if (!A.feed) return startAction(b);
  A.inAct = true; try { act(b); } finally { A.inAct = false; }
});
applyTheme();
window.kk = A;
if ("serviceWorker" in navigator && /^https?:/.test(location.href)) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
render(true);
setInterval(() => { if (A.feed) render(false); }, 400);
})();

</script>
</body>
</html>
